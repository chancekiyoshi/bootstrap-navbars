<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Bootstrap Navbars</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR 1: The Boardroom Kailua -->
  <div class="container-fluid px-0" style="background-color: #133B40; color: white;">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container justify-content-between align-items-center">
        
        <!-- Left: Instagram Icon -->
        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand text-white" href="#">
              <i class="bi bi-instagram text-white"></i>
            </a>
          </li>
        </ul>

        <!-- Center: Boardroom Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img src="boardroom-logo.png" alt="The Boardroom Logo" height="50">
          </li>
        </ul>

        <!-- Right: Menu Button -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark" type="button">Menu</button>
          </li>
        </ul>

      </div>
    </nav>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
