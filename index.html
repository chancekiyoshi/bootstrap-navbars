<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Bootstrap Navbars</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR 1: The Boardroom Kailua -->
  <div class="container-fluid px-0" style="background-color: #133B40; color: white;">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container justify-content-between align-items-center">
        
        <!-- Left: Instagram Icon -->
        <ul class="nav justify-content-start">
          <li class="nav-item">
            <a class="navbar-brand text-white" href="#">
              <i class="bi bi-instagram text-white"></i>
            </a>
          </li>
        </ul>

        <!-- Center: Boardroom Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img src="boardroom-logo.png" alt="The Boardroom Logo" height="50">
          </li>
        </ul>

        <!-- Right: Menu Button -->
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <button class="btn btn-dark" type="button">Menu</button>
          </li>
        </ul>

      </div>
    </nav>
  </div>

  <!--This is NAVBAR 2: Morning Brew-->
  <div>
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container py-2">
            <div class="mx-auto navbar-nav">
                <img src="mb-logo.png" alt="Morning Brew Logo">
            </div>
        </div>
    </nav>

  <!--This one is the Bottom Row: Navigation Links-->
  <nav class="navbar navbar-expand-lg bg-light sticky-top">
    <div class="container">
        <div class="mx-auto navbar-nav">
            <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
            <div class="nav-item border-1 border-top border-dark">Order Online</div>
            <div class="nav-item border-1 border-top border-dark">Menus</div>
            <div class="nav-item border-1 border-top border-dark">Locations</div>
            <div class="nav-item border-1 border-top border-dark">About</div>
            <div class="nav-item border-1 border-top border-dark">Shop</div>
            <div class="nav-item border-1 border-top border-dark">Contact</div>
        </div>
    </div>
  </nav>
  </div>

  <!--NAVBAR 3: Buzz's Original Lanikai-->
  <div class="container-fluid px-0" style="background-color: rgb(48,73,95); color: white;">
    <nav class="navbar navbar-expand-lg bg-gradient">
      <div class="container py-3 justify-content-between align-items-center">
        
        <!-- Left Menu Items -->
        <ul class="nav justify-content-start align-items-center">
          <li class="nav-item px-2"><h4 class="mb-0">LUNCH</h4></li>
          <li class="nav-item px-2"><h4 class="mb-0">DINNER</h4></li>
          <li class="nav-item px-2"><h4 class="mb-0">DRINKS & PUPU</h4></li>
        </ul>

        <!-- Center Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img src="buzzs-logo.png" alt="Buzz's Logo" height="70">
          </li>
        </ul>

        <!-- Right Menu Items + Cart Icon -->
        <ul class="nav justify-content-end align-items-center">
          <li class="nav-item px-2"><h4 class="mb-0">ABOUT</h4></li>
          <li class="nav-item px-2"><h4 class="mb-0">LOCATION</h4></li>
          <li class="nav-item px-2"><h4 class="mb-0">SHOP</h4></li>
          <li class="nav-item px-2">
            <h4 class="mb-0"><i class="bi bi-cart3"></i></h4>
          </li>
        </ul>

      </div>
    </nav>
  </div>

  <!-- NAVBAR 4: Island Snow Hawaii -->
  <div class="container-fluid px-0 bg-light border-bottom">
    <nav class="navbar navbar-expand-lg bg-light py-0">
      <div class="container justify-content-between align-items-center">
        
        <!-- Left: Social Icons & Brand -->
        <ul class="nav align-items-center">
          <li class="nav-item text-dark px-1"><i class="bi bi-facebook"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-twitter"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-pinterest"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-instagram"></i></li>
        </ul>

        <!-- Center: Island Snow Logo -->
        <ul class="nav justify-content-center">
          <li class="nav-item">
            <img src="islandsnow-logo.png" alt="Island Snow Logo" height="50" class="py-1">
          </li>
        </ul>

        <!-- Right: Utility Icons -->
        <ul class="nav align-items-center">
          <li class="nav-item text-dark px-1"><i class="bi bi-house-door-fill"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-search"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-person-fill"></i></li>
          <li class="nav-item text-dark px-1"><i class="bi bi-cart3"></i></li>
        </ul>

      </div>
    </nav>
  </div>


  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
